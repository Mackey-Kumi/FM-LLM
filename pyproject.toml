[project]
name = "fm-llm"
version = "0.1.0"
description = "Reproduction of FM-LLM: a frequency-enhanced mixture-of-experts framework for adapting LLMs to time series forecasting"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=1.26.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "kaggle>=1.7.4",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
